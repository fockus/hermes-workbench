name: data-toolkit
version: "1.0.0"
description: "Document parsing (docling: PDF, DOCX, tables, OCR) and data/ML libraries in Hermes's own runtime, plus a skill on using them."
author: fockus
# PM installs these into the runtime venv that execute_code uses and rebuilds them on `hermes update`.
# docling is pinned exactly: 2.151.1 was 0 days old at install time; bump after >=3 days on PyPI.
python_dependencies:
  - docling==2.150.1
  - pandas>=3.1.1,<4
  - numpy>=2.5.4,<3
  - polars>=2.1.0,<3
  - pyarrow>=26.0.1,<27
  - matplotlib>=3.11.2,<4
  - scikit-learn>=1.9.1,<2
  - scipy>=1.18.1,<2
  - openpyxl>=3.1.5,<4
